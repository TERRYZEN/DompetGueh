plugins { id 'com.android.application' }

android {
    namespace 'id.terry.dompetgueh.offline'
    compileSdk 35

    defaultConfig {
        applicationId 'id.terry.dompetgueh.offline'
        minSdk 26
        targetSdk 35
        versionCode 1
        versionName '1.0.0'
    }
    signingConfigs {
        localRelease {
            storeFile rootProject.file('signing/dompetgueh.jks')
            storePassword 'dompetgueh-offline'
            keyAlias 'dompetgueh'
            keyPassword 'dompetgueh-offline'
        }
    }
    buildTypes {
        release { signingConfig signingConfigs.localRelease; minifyEnabled false }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}
